[project]
name = "lox"
version = "0.1.0"
description = "Lox language implementation in Python"
readme = "README.md"
authors = [{ name = "Seu nome aqui!", email = "seuemail@exemplo.com" }]
requires-python = ">=3.12"

[project.scripts]
pylox = "lox.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4.1", "pytest-timeout>=2.4.0"]

[tool.pytest]
timeout = 1
